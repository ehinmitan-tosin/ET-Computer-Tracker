<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · ET Computers</title>
<link rel="stylesheet" href="/css/styles.css">
<script type="module" src="/js/dashboard.js"></script>
</head>
<body>
<div class="app">

<nav aria-label="Main" class="sidebar">
<div class="brand">
<div class="logo">ET</div>
<div class="brand-text">
<span class="brand-name">ET Computers</span>
<span class="brand-sub">Repair tracker</span>
</div>
</div>
<div class="nav-links">
<a href="/index.html" class="nav-link" aria-current="page">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"></rect><rect x="14" y="3" width="7" height="5" rx="1.5"></rect><rect x="14" y="12" width="7" height="9" rx="1.5"></rect><rect x="3" y="16" width="7" height="5" rx="1.5"></rect></svg>
Dashboard</a>
<a href="/intake.html" class="nav-link">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v8M8 12h8"></path></svg>
New intake</a>
<a href="/index.html" class="nav-link">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>
All jobs</a>
</div>
<div class="user">
<div id="user-initial" class="avatar" aria-hidden="true"></div>
<div class="user-text">
<span id="user-name" class="user-name"></span>
<span class="user-role">Staff</span>
</div>
<a id="logout" href="/login.html" class="logout">Log out</a>
</div>
</nav>

<main class="main main-dashboard">

<div class="page-head">
<div class="stack-4">
<h1 class="page-title">Devices in the shop</h1>
<span id="today" class="page-sub"></span>
</div>
<div class="toolbar">
<form id="search-form" role="search" class="search">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6270" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<label for="search" class="sr-only">Search jobs</label>
<input id="search" name="q" type="search" placeholder="Search ticket, name or phone" autocomplete="off">
</form>
<a href="/intake.html" class="btn btn-primary">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
New intake</a>
</div>
<span id="search-hint" class="search-hint" role="status" hidden></span>
</div>

<div id="error" class="alert alert-error" role="alert" hidden></div>

<div class="stats">
<button type="button" class="stat" data-status="UNDER_REPAIR" aria-pressed="false">
<span class="stat-label"><span class="dot"></span>Under Repair</span>
<span class="stat-count" data-count="UNDER_REPAIR">–</span>
<span class="stat-hint">Being worked on</span>
</button>
<button type="button" class="stat" data-status="ON_HOLD" aria-pressed="false">
<span class="stat-label"><span class="dot"></span>On Hold</span>
<span class="stat-count" data-count="ON_HOLD">–</span>
<span class="stat-hint">Waiting on parts or customer</span>
</button>
<button type="button" class="stat" data-status="COMPLETED" aria-pressed="false">
<span class="stat-label"><span class="dot"></span>Completed</span>
<span class="stat-count" data-count="COMPLETED">–</span>
<span class="stat-hint">Ready for pickup</span>
</button>
<button type="button" class="stat" data-status="DELIVERED" aria-pressed="false">
<span class="stat-label"><span class="dot"></span>Delivered</span>
<span class="stat-count" data-count="DELIVERED">–</span>
<span class="stat-hint">Collected by customer</span>
</button>
</div>

<section class="card jobs-card" aria-label="Jobs">
<div class="jobs-bar">
<div role="group" aria-label="Filter by status" class="filters">
<button type="button" class="chip" data-filter="" aria-pressed="true">All</button>
<button type="button" class="chip" data-filter="UNDER_REPAIR" aria-pressed="false">Under Repair</button>
<button type="button" class="chip" data-filter="ON_HOLD" aria-pressed="false">On Hold</button>
<button type="button" class="chip" data-filter="COMPLETED" aria-pressed="false">Completed</button>
<button type="button" class="chip" data-filter="DELIVERED" aria-pressed="false">Delivered</button>
</div>
<span id="shown" class="jobs-meta" aria-live="polite"></span>
</div>
<div class="table-wrap">
<table class="jobs">
<thead>
<tr>
<th scope="col">Ticket</th>
<th scope="col">Customer</th>
<th scope="col">Device</th>
<th scope="col">Fault</th>
<th scope="col">Status</th>
<th scope="col">Arrived</th>
<th scope="col">Promised</th>
</tr>
</thead>
<tbody id="job-rows">
<tr class="table-message"><td colspan="7">Loading jobs…</td></tr>
</tbody>
</table>
</div>
<div id="load-more-row" class="load-more" hidden>
<button id="load-more" type="button" class="btn btn-secondary">Load more</button>
</div>
</section>

</main>
</div>
</body>
</html>
